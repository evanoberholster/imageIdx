name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Never silently download a different toolchain than the one under test.
  GOTOOLCHAIN: local

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...

  # Full suite on macOS, which is a supported platform for every package.
  test:
    name: test (macos-latest, full)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...

  # Linux is a supported platform for the schema/store/index/search stack. The
  # two AMD64 microkernel packages below have pre-existing, unrelated failures
  # on GitHub's Linux CPUs (they pass on macOS/ARM and are untouched here); see
  # the "Known unrelated CI failures" note in README.md.
  test-linux:
    name: test (ubuntu-latest, schema stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: lint
        run: go vet ./...
      - name: test
        run: |
          go list ./... \
            | grep -v -E 'index/radixhash/internal/tailkernel|index/simhash/internal/hashkernel' \
            | xargs go test -count=1

  race:
    name: race
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 -race ./...

  schema-recovery:
    name: schema recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golden and recovery fixtures
        run: go test -count=1 ./schema -run 'TestGolden|TestPrepared|TestActivation|TestMixed|TestOpenPrevious|TestFailedOpen|TestAllocation|TestLegacyRetirement'
      - name: crash injection
        run: go test -count=1 ./schema -run 'TestPreparedPublicationCrashRecovery|TestActivationPublicationCrashRecovery|TestMixedAllocatorAndPreparedCrashRecovery'

  migration-crash:
    name: database migration crash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./database -run 'TestSchemaAdditionCrashBoundaries|TestLegacySchemaCleanupCrashBoundaries|TestCrashDuringStartupRebuild|TestAllocatorHighWaterAcrossInterruptedActivation|TestResumeInterruptedAdditionWithoutDefinitions|TestCorruptActivationRecordDoesNotPublish|TestDatabaseUpgradesV2SchemaInPlace|TestRepeatedRecoveryIsIdempotent'

  allocator:
    name: allocator benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Informational: NextID/NextIDs must report 0 B/op and 0 allocs/op.
      - run: go test ./schema -run '^$' -bench 'BenchmarkNextID$|BenchmarkNextIDs$|BenchmarkLookupIdentity' -benchmem -benchtime=50ms
