name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Never silently download a different toolchain than the one under test.
  GOTOOLCHAIN: local

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...

  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        run: go test -count=1 ./...

  race:
    name: race (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: race
        run: go test -count=1 -race ./...

  schema-recovery:
    name: schema recovery (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golden and recovery fixtures
        run: go test -count=1 ./schema -run 'TestGolden|TestPrepared|TestActivation|TestMixed|TestOpenPrevious|TestFailedOpen|TestAllocation|TestLegacyRetirement'
      - name: crash injection
        run: go test -count=1 ./schema -run 'TestPreparedPublicationCrashRecovery|TestActivationPublicationCrashRecovery|TestMixedAllocatorAndPreparedCrashRecovery'

  migration-crash:
    name: database migration crash (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./database -run 'TestSchemaAdditionCrashBoundaries|TestLegacySchemaCleanupCrashBoundaries|TestCrashDuringStartupRebuild|TestAllocatorHighWaterAcrossInterruptedActivation|TestResumeInterruptedAdditionWithoutDefinitions|TestCorruptActivationRecordDoesNotPublish|TestDatabaseUpgradesV2SchemaInPlace|TestRepeatedRecoveryIsIdempotent'

  allocator:
    name: allocator benchmarks (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Informational: NextID/NextIDs must report 0 B/op and 0 allocs/op.
      - run: go test ./schema -run '^$' -bench 'BenchmarkNextID$|BenchmarkNextIDs$|BenchmarkLookupIdentity' -benchmem -benchtime=50ms
